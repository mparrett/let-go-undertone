<!doctype html>
<meta charset="utf-8">
<title>undertone</title>
<style>
  body { background: #111; color: #cbd; font: 16px/1.5 monospace; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  #panel { text-align: center; }
  #status { color: #7a8; }
  h1 { margin-bottom: 2px; }
  #sub { color: #567; font-size: 13px; margin-top: 0; }
  a { color: #9ab; }
  #vu { display: flex; gap: 14px; justify-content: center; height: 140px; margin: 24px 0 8px; }
  #vu .band { width: 34px; display: flex; flex-direction: column; }
  /* fixed green/yellow/red zones on the track; the curtain covers the unfilled top */
  #vu .meter { position: relative; flex: 1; background: linear-gradient(to top, #365 0%, #7a8 60%, #ca5 60% 83%, #c55 83% 100%); }
  #vu .curtain { position: absolute; top: 0; left: 0; right: 0; height: 100%; background: #111; transition: height 40ms linear; }
  #vu .peak { position: absolute; left: 0; right: 0; height: 2px; background: #dcb; bottom: 0%; }
  #vu .lbl { color: #678; margin-top: 6px; font-size: 12px; text-align: center; }
</style>
<div id="panel">
  <h1>undertone</h1>
  <p id="sub">generative dungeon ambience from (seed, depth)</p>
  <div id="vu">
    <div class="band"><div class="meter"><div class="curtain"></div><div class="peak"></div></div><div class="lbl">sub</div></div>
    <div class="band"><div class="meter"><div class="curtain"></div><div class="peak"></div></div><div class="lbl">low</div></div>
    <div class="band"><div class="meter"><div class="curtain"></div><div class="peak"></div></div><div class="lbl">mid</div></div>
    <div class="band"><div class="meter"><div class="curtain"></div><div class="peak"></div></div><div class="lbl">hi</div></div>
  </div>
  <p id="status">loading wasm…</p>
  <p>depth via <a href="?depth=0">?depth=0</a> … <a href="?depth=5">?depth=5</a>, seed via <code>?seed=N</code>,
     tension via <a href="?depth=3&tension=1">?tension=0..1</a></p>
</div>
<script src="wasm_exec.js"></script>
<script>
  // Capture AudioContext instances so we (and headless probes) can
  // inspect state and resume on gesture regardless of oto internals.
  window.__audioCtxs = [];
  for (const name of ["AudioContext", "webkitAudioContext"]) {
    const Orig = window[name];
    if (!Orig) continue;
    window[name] = function (...args) {
      const ctx = new Orig(...args);
      window.__audioCtxs.push(ctx);
      return ctx;
    };
    window[name].prototype = Orig.prototype;
  }

  const q = new URLSearchParams(location.search);
  const depth = q.get("depth") ?? "0";
  const seed = q.get("seed") ?? "1";
  const tension = q.get("tension") ?? "0";
  const status = document.getElementById("status");

  const go = new Go();
  go.argv = ["homage", "-play", "-depth", depth, "-seed", seed, "-tension", tension];
  WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
    .then((r) => {
      status.textContent = `depth ${depth}, seed ${seed}, tension ${tension} — click anywhere to start`;
      go.run(r.instance);
    })
    .catch((e) => { status.textContent = "wasm failed: " + e; });

  const resume = () => {
    window.__audioCtxs.forEach((c) => c.resume());
    status.textContent = `playing — depth ${depth}, seed ${seed}, tension ${tension}`;
  };
  addEventListener("click", resume);
  addEventListener("keydown", resume);

  // VU bars from the Go-side meter (window.__homageMeter, ~30 Hz);
  // same bands, ballistics, and peak-hold decay as the TUI meter.
  const curtains = document.querySelectorAll("#vu .curtain");
  const peakEls = document.querySelectorAll("#vu .peak");
  const peaks = [0, 0, 0, 0];
  (function draw() {
    const m = window.__homageMeter;
    if (m) curtains.forEach((c, i) => {
      const pct = Math.min(100, Math.pow(m[i], 0.4) * 100);
      c.style.height = (100 - pct) + "%";
      peaks[i] = Math.max(m[i], peaks[i] * 0.985);
      peakEls[i].style.bottom = Math.min(99, Math.pow(peaks[i], 0.4) * 100) + "%";
    });
    requestAnimationFrame(draw);
  })();
</script>
